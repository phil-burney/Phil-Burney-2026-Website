<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2f67;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a4a8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2f67;stop-opacity:1" />
    </linearGradient>
    <pattern id="stars" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(255,255,255,0.3)"/>
      <circle cx="50" cy="30" r="0.5" fill="rgba(255,255,255,0.2)"/>
      <circle cx="80" cy="70" r="1.5" fill="rgba(255,255,255,0.25)"/>
      <circle cx="30" cy="80" r="0.8" fill="rgba(255,255,255,0.15)"/>
      <circle cx="70" cy="20" r="1" fill="rgba(255,255,255,0.2)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#heroGrad)"/>
  <rect width="100%" height="100%" fill="url(#stars)"/>
  <!-- Placeholder text -->
  <text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="rgba(255,255,255,0.15)" font-size="48" font-family="system-ui, sans-serif" font-weight="600">
    HERO IMAGE PLACEHOLDER
  </text>
  <!-- Decorative shapes -->
  <ellipse cx="15%" cy="80%" rx="200" ry="150" fill="rgba(210,31,60,0.1)"/>
  <ellipse cx="85%" cy="20%" rx="250" ry="180" fill="rgba(255,255,255,0.05)"/>
</svg>
